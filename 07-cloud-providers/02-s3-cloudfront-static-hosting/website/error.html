<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Custom 404/403 Error Page for CloudEdge CDN">
  <title>Page Not Found - CloudEdge CDN</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚠️</text></svg>">
</head>
<body>
  <div class="app-container error-page">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Resource Not Found</h1>
      <p class="error-desc">
        The requested URL was not found on this CloudFront distribution or has been moved.
      </p>
      <div class="error-meta">
        <span>Generated by <strong>CloudEdge CDN Edge Network</strong></span>
        <span>Origin: <strong>Amazon S3 (Private via OAC)</strong></span>
      </div>
      <a href="index.html" class="btn btn-primary">Return to Homepage</a>
    </div>
  </div>
</body>
</html>
