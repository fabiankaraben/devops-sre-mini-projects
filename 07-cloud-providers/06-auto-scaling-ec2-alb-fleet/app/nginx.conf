# ==============================================================================
# Nginx Configuration: Local Application Load Balancer (ALB) Simulation
# ==============================================================================
# Mounted to /etc/nginx/conf.d/default.conf

# Upstream Target Group (Simulating Multi-AZ Round-Robin Distribution)
upstream asg_target_group {
    server app-node-1:80 max_fails=2 fail_timeout=5s;
    server app-node-2:80 max_fails=2 fail_timeout=5s;
    server app-node-3:80 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    server_name localhost;

    # Health Check endpoint for ALB listener
    location /alb-status {
        access_log off;
        default_type application/json;
        return 200 '{"alb_status": "active", "algorithm": "round_robin", "target_group": "asg_target_group"}';
    }

    # Route all traffic to Target Group
    location / {
        proxy_pass http://asg_target_group;
        proxy_http_version 1.1;

        # Proxy Headers (Standard ALB behavior)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Target Group Error Handling (Skip unhealthy nodes)
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        # Pass through custom instance headers from backend
        proxy_pass_header X-Instance-Id;
        proxy_pass_header X-Availability-Zone;
    }
}
