# ==============================================================================
# Prometheus Scrape & Remote Write Configuration (08-08)
# ==============================================================================

global:
  scrape_interval: 2s
  evaluation_interval: 2s

# ------------------------------------------------------------------------------
# Prometheus remote_write to VictoriaMetrics Long-Term Storage
# ------------------------------------------------------------------------------
remote_write:
  - url: "http://victoriametrics:8428/api/v1/write"
    name: "victoriametrics-lts"
    queue_config:
      max_samples_per_send: 1000
      capacity: 10000
      max_shards: 10
      min_shards: 1
      batch_send_deadline: 500ms

scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. High-Cardinality Mock Exporter
  # ----------------------------------------------------------------------------
  - job_name: "mock-exporter"
    static_configs:
      - targets: ["mock-exporter:8080"]
        labels:
          environment: "production"
          datacenter: "us-east-1"

  # ----------------------------------------------------------------------------
  # 2. VictoriaMetrics Server Internal Metrics
  # ----------------------------------------------------------------------------
  - job_name: "victoriametrics"
    static_configs:
      - targets: ["victoriametrics:8428"]
        labels:
          role: "storage-backend"

  # ----------------------------------------------------------------------------
  # 3. Prometheus Server Internal Metrics
  # ----------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          role: "scraper"
