# ==============================================================================
# Docker Compose - Grafana Dashboards as Code Provisioning Stack
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Visualization Tier: Grafana Dashboard Server (Dashboards as Code)
  # ----------------------------------------------------------------------------
  grafana:
    build:
      context: .
      dockerfile: grafana/Dockerfile
    image: mini-proj-08-03-grafana:local
    container_name: grafana-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - dashboards-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      prometheus:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 2. Time-Series Metrics Tier: Prometheus Monitoring Server
  # ----------------------------------------------------------------------------
  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    image: mini-proj-08-03-prometheus:local
    container_name: prometheus-server
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - dashboards-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------------------------------
  # 3. Infrastructure Exporter: Prometheus Node Exporter
  # ----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - dashboards-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------------------------------
  # 4. Telemetry Generator: Instrumented Python Microservice
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: mini-proj-08-03-app:local
    container_name: telemetry-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - dashboards-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

networks:
  dashboards-net:
    name: dashboards-stack-net
    driver: bridge

volumes:
  grafana_data:
    name: grafana_storage_data
  prometheus_data:
    name: prometheus_storage_data
