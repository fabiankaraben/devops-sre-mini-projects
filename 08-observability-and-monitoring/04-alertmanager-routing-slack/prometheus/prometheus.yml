# ==============================================================================
# Prometheus Server Configuration with Alertmanager Integration
# ==============================================================================

global:
  scrape_interval: 2s
  evaluation_interval: 2s
  scrape_timeout: 2s

  external_labels:
    cluster: 'production-us-east-1'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - scheme: http
      timeout: 5s
      api_version: v2
      static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Alertmanager monitoring
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # 3. Target Application Microservice
  - job_name: 'instrumented_app'
    scrape_interval: 2s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8000']
        labels:
          app: 'checkout-service'
          service: 'checkout-api'
          tier: 'application'
