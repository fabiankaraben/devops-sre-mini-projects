# ==============================================================================
# prometheus.yml - Prometheus Configuration for Synthetic Playwright Probes
# ==============================================================================

global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "synthetic-agent"
    metrics_path: /metrics
    static_configs:
      - targets: ["synthetic-agent:9115"]
        labels:
          environment: "production-simulation"
          probe_type: "playwright-synthetic"

  - job_name: "prometheus"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
