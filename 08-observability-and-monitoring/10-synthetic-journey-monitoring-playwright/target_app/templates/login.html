<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CloudStore</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <a href="/" class="brand-logo" id="nav-brand">⚡ CloudStore</a>
            <div class="nav-links">
                <a href="/" class="nav-link" id="nav-catalog">Catalog</a>
                <a href="/cart" class="nav-link" id="nav-cart">Cart <span class="cart-badge" id="cart-count">{{ cart_count }}</span></a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="form-card" id="login-card">
            <h2 style="margin-bottom: 0.5rem; text-align: center;">Welcome Back</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem; text-align: center;">Sign in to complete your checkout</p>

            {% if error %}
            <div class="error-alert" id="login-error">{{ error }}</div>
            {% endif %}

            <form action="/api/login" method="POST" id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-input" type="email" id="email" name="email" value="sre-synthetic@cloudstore.io" required placeholder="name@company.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" name="password" value="SyntheticPass2026!" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="btn-submit-login" style="margin-top: 1rem;">
                    Sign In & Continue
                </button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 CloudStore Synthetic Monitoring Target App</p>
    </footer>
</body>
</html>
