# ==============================================================================
# Prometheus Configuration - Application RED & USE Monitoring
# ==============================================================================

global:
  scrape_interval: 2s       # High-resolution 2s scrape for real-time application metrics
  evaluation_interval: 2s   # 2s rule evaluation interval
  scrape_timeout: 2s

  external_labels:
    environment: 'local-development'
    service: 'instrumented-microservice'

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # 1. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']

  # 2. Application Microservice (RED & USE Metrics)
  - job_name: 'instrumented_app'
    scrape_interval: 2s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8000']
        labels:
          app: 'demo-api'
          environment: 'local-dev'
          tier: 'application'
