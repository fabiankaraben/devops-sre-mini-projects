# ==============================================================================
# Custom Helm Values for kube-prometheus-stack (08-09)
# ==============================================================================
# Tuned for local development clusters (k3d/k3s) with dynamic CRD discovery,
# NodePort services, fast evaluation intervals, and lightweight resource footprints.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Prometheus Operator Configuration
# ------------------------------------------------------------------------------
prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ------------------------------------------------------------------------------
# 2. Prometheus Instance & CRD Selector Configuration
# ------------------------------------------------------------------------------
prometheus:
  enabled: true
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    scrapeInterval: "5s"
    evaluationInterval: "5s"
    retention: "24h"
    # CRITICAL: Allow Prometheus to discover CRDs regardless of Helm release labels
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    # Match all namespaces for custom monitors
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1024Mi

# ------------------------------------------------------------------------------
# 3. Alertmanager Configuration
# ------------------------------------------------------------------------------
alertmanager:
  enabled: true
  service:
    type: NodePort
    nodePort: 30093
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi

# ------------------------------------------------------------------------------
# 4. Grafana Visualization Dashboard
# ------------------------------------------------------------------------------
grafana:
  enabled: true
  adminPassword: "prom-operator"
  service:
    type: NodePort
    nodePort: 30030
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  livenessProbe:
    initialDelaySeconds: 90
    periodSeconds: 10
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 10
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

# ------------------------------------------------------------------------------
# 5. Auxiliary Node & Workload Observability
# ------------------------------------------------------------------------------
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

defaultRules:
  create: true
  rules:
    etcd: false
    kubeScheduler: false
    kubeControllerManager: false
