# ==============================================================================
# fluent-bit.conf - Centralized Fluent Bit Kubernetes DaemonSet Configuration
# ==============================================================================

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   on
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  on

# ------------------------------------------------------------------------------
# 1. Input: Tail Kubernetes Node Container Logs
# ------------------------------------------------------------------------------
[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/*.log
    Exclude_Path      /var/log/containers/fluent-bit*.log
    Parser            cri
    DB                /var/log/flb_kube.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  2
    Read_from_Head    True

# ------------------------------------------------------------------------------
# 2. Filter: Enrich Records with Kubernetes API Metadata
# ------------------------------------------------------------------------------
[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Merge_Log_Key       log_processed
    Keep_Log            Off
    K8S-Logging.Parser  On
    K8S-Logging.Exclude On
    Labels              On
    Annotations         On
    Buffer_Size         64k

# ------------------------------------------------------------------------------
# 3. Output: Structured NDJSON Sink for Inspection & Centralized Forwarding
# ------------------------------------------------------------------------------
[OUTPUT]
    Name            stdout
    Match           kube.*
    Format          json_lines
