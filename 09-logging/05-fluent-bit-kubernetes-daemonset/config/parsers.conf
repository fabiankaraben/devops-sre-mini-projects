# ==============================================================================
# parsers.conf - Fluent Bit Parsers for CRI / Containerd / Docker Log Formats
# ==============================================================================

[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

[PARSER]
    Name        cri
    Format      regex
    Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<_p>[^ ]*) (?<log>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

[PARSER]
    Name        json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

[PARSER]
    Name        k8s-custom-tag
    Format      regex
    Regex       (?<namespace_name>[^_]+)_(?<pod_name>[^_]+)_(?<docker_id>[a-z0-9]{64})
