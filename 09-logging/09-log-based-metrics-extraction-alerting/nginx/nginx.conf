events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Standard extended access log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 8080;
        server_name localhost;

        # Standard healthy endpoint
        location / {
            return 200 '{"status":"ok","service":"nginx-demo","timestamp":"$time_iso8601"}\n';
        }

        # Healthcheck endpoint
        location /api/health {
            return 200 '{"status":"healthy","uptime":"ok"}\n';
        }

        # Fault Injection: HTTP 500 Internal Server Error
        location /api/error {
            return 500 '{"error":"InternalServerError","code":500,"message":"Simulated critical failure"}\n';
        }

        # Fault Injection: HTTP 503 Service Unavailable
        location /api/unavailable {
            return 503 '{"error":"ServiceUnavailable","code":503,"message":"Downstream upstream timed out"}\n';
        }

        # Fault Injection: HTTP 502 Bad Gateway
        location /api/gateway-error {
            return 502 '{"error":"BadGateway","code":502,"message":"Upstream server refused connection"}\n';
        }
    }
}
