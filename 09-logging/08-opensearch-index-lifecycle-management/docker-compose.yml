# ==============================================================================
# Docker Compose: Mini-Project 09-08 OpenSearch Index Lifecycle Management (ISM)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # OpenSearch Single-Node Distributed Search & Analytics Engine
  # ----------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch-node
    environment:
      - discovery.type=single-node
      - cluster.name=opensearch-ism-cluster
      - node.name=opensearch-node-01
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=my_strong_password_123!
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # Fast ISM job execution for testing and simulation
      - plugins.index_state_management.job_interval=1
      - plugins.index_state_management.jitter=0
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - opensearch-ism-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cluster/health 2>/dev/null | grep -Eq '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 25
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # OpenSearch Dashboards Web UI (Index Management & Visualizations)
  # ----------------------------------------------------------------------------
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: opensearch-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    networks:
      - opensearch-ism-net
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:5601/api/status 2>/dev/null | grep -q '\"state\":\"green\"' || exit 1"]
      interval: 4s
      timeout: 5s
      retries: 25
      start_period: 15s
    restart: unless-stopped

volumes:
  opensearch_data:
    name: opensearch_data

networks:
  opensearch-ism-net:
    name: opensearch-ism-net
    driver: bridge
