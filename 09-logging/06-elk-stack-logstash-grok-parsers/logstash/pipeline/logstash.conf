# ==============================================================================
# Logstash Pipeline: Grok Parsing, GeoIP, UserAgent & Date Filters
# ==============================================================================

input {
  # TCP streaming input for high-speed log ingestion from scripts & collectors
  tcp {
    port => 50000
    codec => line { charset => "UTF-8" }
    tags => ["input_tcp"]
  }

  # UDP input for syslog-style connectionless streaming
  udp {
    port => 50000
    codec => line { charset => "UTF-8" }
    tags => ["input_udp"]
  }

  # HTTP REST input for log ingestion via HTTP POST
  http {
    port => 8080
    codec => json
    tags => ["input_http"]
  }
}

filter {
  # ----------------------------------------------------------------------------
  # 1. Stage 1: Grok Unstructured Log Parsing
  # ----------------------------------------------------------------------------
  if [message] {
    grok {
      patterns_dir => ["/usr/share/logstash/patterns"]
      match => {
        "message" => [
          # Match 1: Nginx Extended Log with Latency (in ms)
          "^%{NGINX_ACCESS_EXTENDED}$",

          # Match 2: Standard Apache Combined Access Log
          "^%{APACHE_COMBINED_CUSTOM}$",

          # Match 3: Standard Apache Common Access Log
          "^%{APACHE_COMMON_CUSTOM}$",

          # Match 4: Microservice Application Log Format
          "^%{APP_LOG_FORMAT}$"
        ]
      }
      add_tag => ["grok_parsed"]
    }
  }

  # Classify log type based on extracted fields
  if [request_time_ms] {
    mutate {
      add_field => { "log_type" => "nginx_access" }
    }
  } else if [user_agent] and [response_code] {
    mutate {
      add_field => { "log_type" => "apache_combined" }
    }
  } else if [response_code] and ![user_agent] {
    mutate {
      add_field => { "log_type" => "apache_common" }
    }
  } else if [service_name] {
    mutate {
      add_field => { "log_type" => "app_log" }
    }
  } else {
    mutate {
      add_field => { "log_type" => "unclassified" }
    }
  }

  # ----------------------------------------------------------------------------
  # 2. Stage 2: GeoIP IP Geolocation Enrichment
  # ----------------------------------------------------------------------------
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }

  # ----------------------------------------------------------------------------
  # 3. Stage 3: User-Agent Parsing
  # ----------------------------------------------------------------------------
  if [user_agent] and [user_agent] != "-" {
    useragent {
      source => "user_agent"
      target => "user_agent_details"
    }
  }

  # ----------------------------------------------------------------------------
  # 4. Stage 4: Date Filter Normalization
  # ----------------------------------------------------------------------------
  if [timestamp] {
    date {
      match => [
        "timestamp",
        "dd/MMM/yyyy:HH:mm:ss Z",
        "dd/MMM/yyyy:HH:mm:ss",
        "ISO8601"
      ]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  } else if [log_timestamp] {
    date {
      match => [
        "log_timestamp",
        "ISO8601",
        "yyyy-MM-dd'T'HH:mm:ss.SSSZZ",
        "yyyy-MM-dd'T'HH:mm:ssZZ",
        "yyyy-MM-dd HH:mm:ss,SSS",
        "yyyy-MM-dd HH:mm:ss.SSS"
      ]
      target => "@timestamp"
      remove_field => ["log_timestamp"]
    }
  }

  # ----------------------------------------------------------------------------
  # 5. Stage 5: Field Type Mutations & Cleansing
  # ----------------------------------------------------------------------------
  mutate {
    convert => {
      "response_code" => "integer"
      "bytes_sent" => "integer"
      "request_time_ms" => "float"
    }
    strip => ["request_method", "request_path", "log_level", "service_name"]
  }
}

output {
  # Primary Output: Indexed in Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "elk-logs-%{+YYYY.MM.dd}"
    template_name => "elk-logs"
    template => "/usr/share/logstash/templates/elk_logs_template.json"
    template_overwrite => true
  }

  # Secondary Output: Local stdout for real-time container log observation
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
