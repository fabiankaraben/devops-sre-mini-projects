# ==============================================================================
# Docker Compose: Mini-Project 09-06 ELK Stack with Logstash Grok Parsers
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Elasticsearch: Core Search & Indexing Engine (Single-Node)
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elk-stack-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=elk-local-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elk_es_data:/usr/share/elasticsearch/data
    networks:
      - elk-stack-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 2. Logstash: Ingestion, Grok Parsing, GeoIP Enrichment & Normalization Engine
  # ----------------------------------------------------------------------------
  logstash:
    build:
      context: ./logstash
      dockerfile: Dockerfile
    image: mini-proj-09-06-logstash:local
    container_name: elk-stack-logstash
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "50000:50000"
      - "50000:50000/udp"
      - "8080:8080"
      - "9600:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-stack-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600/_node/stats | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"\\|\"pipelines\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 3. Kibana: Centralized Analytics & Dashboard Visualization Interface
  # ----------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: elk-stack-kibana
    environment:
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-stack-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  elk_es_data:
    name: elk_es_data

networks:
  elk-stack-net:
    name: elk-stack-net
    driver: bridge
