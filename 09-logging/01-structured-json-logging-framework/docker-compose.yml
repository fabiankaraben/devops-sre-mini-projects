# ==============================================================================
# Docker Compose: Mini-Project 09-01 Structured JSON Logging Framework
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-proj-09-01-json-logger:local
    container_name: structured-logging-app
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=order-processing-service
      - ENVIRONMENT=production
      - LOG_LEVEL=DEBUG
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.2"
          memory: 64M
    networks:
      - logging-stack-net
    restart: unless-stopped

networks:
  logging-stack-net:
    name: logging-stack-net
    driver: bridge
