# ==============================================================================
# /etc/logrotate.d/custom-app-copytruncate (Educational Reference)
# In-Place Truncation Strategy for Legacy Daemons without SIGHUP Support
# ==============================================================================

/var/log/custom-app/*.log {
    daily
    maxsize 50M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress

    # Copytruncate: Copies the active log file to the rotated target name,
    # then truncates the original file in-place to 0 bytes.
    # Note: There is a microsecond race condition between copy and truncate
    # where lines written by the daemon during that window may be lost.
    copytruncate
}
