# ==============================================================================
# /etc/logrotate.d/custom-app
# Production Logrotate Policy with Non-Disruptive SIGHUP Daemon Reload
# ==============================================================================

/var/log/custom-app/*.log {
    # Frequency & size triggers: Rotate daily or whenever size exceeds 50 Megabytes
    daily
    maxsize 50M

    # Retention: Keep 7 rotated archive generations before deleting the oldest
    rotate 7

    # Hygiene: Do not error if the log file is missing, and skip empty log files
    missingok
    notifempty

    # Compression: Compress rotated files with gzip
    # delaycompress ensures .1 remains uncompressed until the next rotation cycle,
    # giving background writers ample time to finish flushing active buffers.
    compress
    delaycompress

    # File Creation: Recreate active log file immediately after renaming
    create 0640 root root

    # Shared Scripts: Run postrotate hook only once per rotation cycle, not per file
    sharedscripts

    # Post-Rotate Hook: Send SIGHUP to the application daemon to signal file descriptor reopening
    postrotate
        if [ -f /var/run/custom-app.pid ]; then
            kill -HUP $(cat /var/run/custom-app.pid) 2>/dev/null || true
        fi
    endscript
}
