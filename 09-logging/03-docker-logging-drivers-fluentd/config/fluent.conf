# ==============================================================================
# fluent.conf - Fluentd Collector Configuration for Docker Logging Driver
# ==============================================================================

# 1. Forward Input Plugin: Ingests logs from Docker Daemon / Container Drivers
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# 2. Monitor Agent: Exposes HTTP status and buffer queue metrics
<source>
  @type monitor_agent
  bind 0.0.0.0
  port 24220
</source>

# 3. Filter Plugin: Parse JSON payloads and enrich records
<filter docker.**>
  @type record_transformer
  enable_ruby true
  <record>
    ingested_at ${time.strftime('%Y-%m-%dT%H:%M:%S.%3NZ')}
    fluentd_host ${hostname}
    docker_tag ${tag}
  </record>
</filter>

# 4. Match & Output Sink: Write directly to persistent NDJSON storage
<match docker.**>
  @type file
  path /fluentd/log/docker_events
  append true
  <buffer>
    @type file
    path /fluentd/buffer/docker_events
    flush_mode interval
    flush_interval 1s
    chunk_limit_size 16m
    queue_limit_length 64
    retry_max_interval 5s
    retry_forever true
  </buffer>
  <format>
    @type json
  </format>
</match>

# 5. Internal Fluentd Log Stream
<match fluent.**>
  @type stdout
</match>
