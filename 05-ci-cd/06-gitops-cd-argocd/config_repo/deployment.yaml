apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-webapp
  labels:
    app.kubernetes.io/name: gitops-webapp
    app.kubernetes.io/instance: gitops-webapp-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: web-frontend
    app.kubernetes.io/part-of: gitops-pipeline
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gitops-webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitops-webapp
        app.kubernetes.io/instance: gitops-webapp-prod
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: webapp
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: gitops-webapp-config
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
                - NET_RAW
              add:
                - NET_BIND_SERVICE
                - CHOWN
                - SETUID
                - SETGID
