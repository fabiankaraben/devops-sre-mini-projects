name: Multi-Arch Docker Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - '05-ci-cd/02-multi-arch-docker-build-push-pipeline/**'
      - '.github/workflows/docker_publish.yml'
  pull_request:
    branches:
      - main
    paths:
      - '05-ci-cd/02-multi-arch-docker-build-push-pipeline/**'
      - '.github/workflows/docker_publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/multiarch-microservice

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ============================================================================
  # Stage 1: Go Application Tests & Code Quality Gate
  # ============================================================================
  test-and-lint:
    name: 🧪 Run Unit Tests & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-ci-cd/02-multi-arch-docker-build-push-pipeline/app
    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4

      - name: 🐹 Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: 05-ci-cd/02-multi-arch-docker-build-push-pipeline/app/go.mod

      - name: 🔬 Execute Unit Tests
        run: go test -v -race -coverprofile=coverage.out ./...

  # ============================================================================
  # Stage 2: Multi-Architecture Build & Push to GHCR
  # ============================================================================
  build-and-push-multiarch:
    name: 🐳 Build Multi-Arch (amd64/arm64) & Publish
    needs: [test-and-lint]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4

      - name: 🌐 Setup QEMU for Multi-Architecture Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: 🛠️ Setup Docker Buildx Builder
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: 🔐 Authenticate with GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata and Semantic Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🚀 Build and Push Multi-Arch Container Image
        uses: docker/build-push-action@v6
        with:
          context: 05-ci-cd/02-multi-arch-docker-build-push-pipeline
          file: 05-ci-cd/02-multi-arch-docker-build-push-pipeline/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
