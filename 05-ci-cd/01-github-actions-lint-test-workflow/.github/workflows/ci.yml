name: CI Matrix Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '05-ci-cd/01-github-actions-lint-test-workflow/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - '05-ci-cd/01-github-actions-lint-test-workflow/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # Stage 1: Static Analysis & Code Quality Checks
  # ============================================================================
  lint-and-typecheck:
    name: 🔍 Static Analysis (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-ci-cd/01-github-actions-lint-test-workflow
    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4

      - name: ⚡ Setup pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js Runtime with Dependency Caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 05-ci-cd/01-github-actions-lint-test-workflow/pnpm-lock.yaml

      - name: 📦 Install Project Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛡️ Run ESLint Static Analysis
        run: pnpm lint

      - name: 📐 Run TypeScript Type Checks
        run: pnpm tsc --noEmit

  # ============================================================================
  # Stage 2: Parallel Multi-Version Matrix Unit Testing
  # ============================================================================
  matrix-test:
    name: 🧪 Test Matrix (${{ matrix.os }} / Node ${{ matrix.node-version }})
    needs: [lint-and-typecheck]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [18.x, 20.x, 22.x]
    defaults:
      run:
        working-directory: 05-ci-cd/01-github-actions-lint-test-workflow
    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4

      - name: ⚡ Setup pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js ${{ matrix.node-version }} with Caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: 05-ci-cd/01-github-actions-lint-test-workflow/pnpm-lock.yaml

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Execute Unit Test Suite with Coverage
        run: pnpm test:coverage

      - name: 📤 Upload Code Coverage Artifact (Node 22)
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-node-${{ matrix.node-version }}
          path: 05-ci-cd/01-github-actions-lint-test-workflow/coverage/
          retention-days: 7

  # ============================================================================
  # Stage 3: Production Build & Artifact Packaging
  # ============================================================================
  build-and-package:
    name: 📦 Build & Package Production Bundle
    needs: [matrix-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-ci-cd/01-github-actions-lint-test-workflow
    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4

      - name: ⚡ Setup pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 05-ci-cd/01-github-actions-lint-test-workflow/pnpm-lock.yaml

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚙️ Compile TypeScript to Production JavaScript
        run: pnpm build

      - name: 🚀 Verify Executable Bundle
        run: node dist/index.js

      - name: 📤 Upload Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: 05-ci-cd/01-github-actions-lint-test-workflow/dist/
          retention-days: 7
