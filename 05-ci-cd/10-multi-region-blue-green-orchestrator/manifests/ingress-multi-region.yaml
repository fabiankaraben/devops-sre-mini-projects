apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-service-ingress
  annotations:
    ingress.class: traefik
spec:
  rules:
    - host: api.production.global
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-service-live
                port:
                  number: 80
