name: Semantic Release Automation

on:
  push:
    branches:
      - main
    paths:
      - '05-ci-cd/03-semantic-release-automated-changelog/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # ============================================================================
  # Automated Release Pipeline (Commit Analysis -> SemVer Bump -> Release Notes)
  # ============================================================================
  release:
    name: 🚀 Analyze Commits & Publish Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-ci-cd/03-semantic-release-automated-changelog
    steps:
      - name: 📥 Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚡ Setup pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js Runtime with Dependency Caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 05-ci-cd/03-semantic-release-automated-changelog/pnpm-lock.yaml

      - name: 📦 Install Project Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛡️ Run Static Code Analysis (ESLint)
        run: pnpm lint

      - name: 🧪 Execute Unit Test Suite
        run: pnpm test

      - name: ⚙️ Compile TypeScript to Production Bundle
        run: pnpm build

      - name: 🚀 Execute Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: 'github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: 'github-actions[bot]@users.noreply.github.com'
        run: npx semantic-release
