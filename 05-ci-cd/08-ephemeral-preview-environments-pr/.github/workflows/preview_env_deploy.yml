name: Deploy Ephemeral PR Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Review App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Preview Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: preview-app:pr-${{ github.event.pull_request.number }}-${{ github.sha }}

      - name: Set up Helm & Kubectl
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Provision Ephemeral Namespace & Deploy Helm Chart
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.sha }}
        run: |
          NS="preview-pr-${PR_NUM}"
          echo "::group::Deploying Preview Release to ${NS}"
          
          kubectl create namespace "${NS}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "${NS}" \
            environment=preview \
            preview.local/pr-number="${PR_NUM}" \
            --overwrite

          helm upgrade --install \
            "preview-pr-${PR_NUM}" \
            ./charts/preview-app \
            --namespace "${NS}" \
            --set prNumber="${PR_NUM}" \
            --set commitSha="${SHA:0:8}" \
            --set branchName="${BRANCH}" \
            --set image.tag="pr-${PR_NUM}-${SHA}" \
            --wait --timeout 3m

          echo "::endgroup::"

      - name: Post or Update PR Preview Comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `http://pr-${prNumber}.preview.local:8085`;
            const commitSha = context.sha.substring(0, 8);
            const commentBody = `### 🚀 Ephemeral Preview Environment Deployed!\n\n` +
              `| Attribute | Details |\n` +
              `| :--- | :--- |\n` +
              `| **Preview URL** | [${previewUrl}](${previewUrl}) |\n` +
              `| **Namespace** | \`preview-pr-${prNumber}\` |\n` +
              `| **Commit** | \`${commitSha}\` |\n` +
              `| **Branch** | \`${context.payload.pull_request.head.ref}\` |\n` +
              `| **Status** | ✅ **Active & Ready** |\n\n` +
              `> *This environment is ephemeral and will be automatically destroyed when this pull request is closed.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => c.body.includes('Ephemeral Preview Environment'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
