services:
  chatops-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatops-deployment-bot
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      - SLACK_SIGNING_SECRET=supersecret_slack_signing_token_123
      - RBAC_FILE=/app/rbac_policy.json
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
