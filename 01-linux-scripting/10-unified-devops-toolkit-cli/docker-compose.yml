services:
  node1:
    build:
      context: ./mock_cluster/node1
      dockerfile: Dockerfile
    image: mock-ssh-node1:latest
    container_name: mock_ssh_node1
    ports:
      - "2222:22"
    networks:
      devops_net:
        ipv4_address: 172.29.0.10
    restart: unless-stopped

  node2:
    build:
      context: ./mock_cluster/node2
      dockerfile: Dockerfile
    image: mock-ssh-node2:latest
    container_name: mock_ssh_node2
    ports:
      - "2223:22"
    networks:
      devops_net:
        ipv4_address: 172.29.0.20
    restart: unless-stopped

  toolkit_runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: unified-devops-toolkit:latest
    container_name: devops_toolkit_runner
    depends_on:
      - node1
      - node2
    networks:
      devops_net:
        ipv4_address: 172.29.0.50
    command: ["sys", "health", "--json"]

networks:
  devops_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/24
