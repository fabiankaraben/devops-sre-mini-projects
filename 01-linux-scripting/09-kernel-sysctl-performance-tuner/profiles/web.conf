# ==============================================================================
# Performance Profile: Web & High-Concurrency Reverse Proxy (Nginx / Envoy / API)
# ==============================================================================

# Socket Listen & Connection Backlogs
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.netdev_max_backlog = 65535

# TCP Socket Recycling & Ephemeral Ports
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_slow_start_after_idle = 0

# TCP Socket Read / Write Memory Buffers (Min Default Max)
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Memory & Swappiness
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Filesystem Open File Limits
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
