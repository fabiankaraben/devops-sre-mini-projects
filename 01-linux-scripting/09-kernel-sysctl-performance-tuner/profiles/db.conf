# ==============================================================================
# Performance Profile: Database & High-Throughput Storage (PostgreSQL / Redis / MySQL)
# ==============================================================================

# Memory Subsystem & Page Cache Management
vm.swappiness = 1
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.max_map_count = 262144

# Socket Buffers & Connection Limits
net.core.somaxconn = 32768
net.ipv4.tcp_max_syn_backlog = 32768
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# TCP Keepalive Tuning for Long-Lived Database Sessions
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5

# Filesystem & Asynchronous IO Limits
fs.file-max = 2097152
fs.aio-max-nr = 1048576
