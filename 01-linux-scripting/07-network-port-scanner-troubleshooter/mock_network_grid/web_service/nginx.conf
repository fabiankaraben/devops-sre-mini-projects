worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens on;

    # Port 80 - Main Web Service
    server {
        listen 80;
        server_name localhost;

        location / {
            default_type text/plain;
            return 200 "OK - Web Server Frontend (Port 80)\n";
        }

        location /healthz {
            default_type text/plain;
            return 200 "healthy\n";
        }
    }

    # Port 8080 - REST API Service
    server {
        listen 8080;
        server_name localhost;

        location / {
            default_type application/json;
            return 200 '{"status":"healthy","service":"api-gateway","version":"1.4.2"}\n';
        }

        location /healthz {
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
