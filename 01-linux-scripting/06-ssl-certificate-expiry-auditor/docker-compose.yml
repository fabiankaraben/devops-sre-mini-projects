services:
  mock_tls_server:
    build:
      context: ./mock_tls_environment
      dockerfile: Dockerfile
    image: mock-tls-server:latest
    container_name: mock_tls_server
    ports:
      - "8443:8443"
      - "8444:8444"
      - "8445:8445"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-k", "--fail", "https://localhost:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  cert_auditor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ssl-cert-auditor:latest
    container_name: ssl_cert_auditor
    depends_on:
      mock_tls_server:
        condition: service_healthy
    command: ["-k", "-t", "mock_tls_server:8443", "-t", "mock_tls_server:8444", "-t", "mock_tls_server:8445", "--no-fail"]
