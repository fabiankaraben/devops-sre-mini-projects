worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$ssl_protocol" "$ssl_cipher"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # SSL Global configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --------------------------------------------------------------------------
    # 1. Endpoint: Valid Certificate (90 Days Validity) - Port 8443
    # --------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        server_name valid.local localhost;

        ssl_certificate /etc/nginx/certs/valid.local.crt;
        ssl_certificate_key /etc/nginx/certs/valid.local.key;

        location / {
            default_type application/json;
            return 200 '{"status":"OK","endpoint":"valid.local","port":8443,"cert_status":"valid","validity_days":90}\n';
        }

        location /healthz {
            default_type text/plain;
            return 200 "healthy\n";
        }
    }

    # --------------------------------------------------------------------------
    # 2. Endpoint: Expiring Soon Certificate (10 Days Validity) - Port 8444
    # --------------------------------------------------------------------------
    server {
        listen 8444 ssl;
        server_name expiring.local localhost;

        ssl_certificate /etc/nginx/certs/expiring.local.crt;
        ssl_certificate_key /etc/nginx/certs/expiring.local.key;

        location / {
            default_type application/json;
            return 200 '{"status":"WARNING","endpoint":"expiring.local","port":8444,"cert_status":"expiring_soon","validity_days":10}\n';
        }

        location /healthz {
            default_type text/plain;
            return 200 "healthy\n";
        }
    }

    # --------------------------------------------------------------------------
    # 3. Endpoint: Expired Certificate - Port 8445
    # --------------------------------------------------------------------------
    server {
        listen 8445 ssl;
        server_name expired.local localhost;

        ssl_certificate /etc/nginx/certs/expired.local.crt;
        ssl_certificate_key /etc/nginx/certs/expired.local.key;

        location / {
            default_type application/json;
            return 200 '{"status":"CRITICAL","endpoint":"expired.local","port":8445,"cert_status":"expired","validity_days":0}\n';
        }

        location /healthz {
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
