apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-agent-sa
  namespace: node-monitoring
  labels:
    app.kubernetes.io/name: node-system-agent
    app.kubernetes.io/component: monitoring-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-agent-role
  labels:
    app.kubernetes.io/name: node-system-agent
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - nodes/spec
      - nodes/stats
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-agent-rolebinding
  labels:
    app.kubernetes.io/name: node-system-agent
subjects:
  - kind: ServiceAccount
    name: node-agent-sa
    namespace: node-monitoring
roleRef:
  kind: ClusterRole
  name: node-agent-role
  apiGroup: rbac.authorization.k8s.io
