apiVersion: v1
kind: Pod
metadata:
  name: static-diagnostics-web
  namespace: default
  labels:
    app.kubernetes.io/name: static-diagnostics-web
    app.kubernetes.io/managed-by: kubelet-static-pod
    tier: control-plane-diagnostics
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  restartPolicy: Always
  containers:
    - name: diagnostics-server
      image: static-diagnostics-app:v1.0.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8888
          protocol: TCP
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: COMPONENT_TYPE
          value: "static-diagnostics-web"
        - name: MANIFEST_SOURCE
          value: "/etc/kubernetes/manifests/static-diagnostics-web.yaml"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
      readinessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 2
