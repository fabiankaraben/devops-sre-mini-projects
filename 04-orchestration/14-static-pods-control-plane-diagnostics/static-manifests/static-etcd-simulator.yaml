apiVersion: v1
kind: Pod
metadata:
  name: static-etcd-simulator
  namespace: kube-system
  labels:
    component: etcd
    tier: control-plane
    app.kubernetes.io/managed-by: kubelet-static-pod
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  restartPolicy: Always
  containers:
    - name: etcd-simulator
      image: static-diagnostics-app:v1.0.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: client
          containerPort: 8888
          protocol: TCP
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: COMPONENT_TYPE
          value: "control-plane-etcd"
        - name: MANIFEST_SOURCE
          value: "/etc/kubernetes/manifests/etcd.yaml"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      livenessProbe:
        httpGet:
          path: /healthz
          port: client
        initialDelaySeconds: 5
        periodSeconds: 10
      volumeMounts:
        - name: etcd-data
          mountPath: /var/lib/etcd
  volumes:
    - name: etcd-data
      hostPath:
        path: /var/lib/etcd
        type: DirectoryOrCreate
