apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-compute-quota
  namespace: prod-critical
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1000m"
    limits.memory: 1Gi
    count/pods: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: batch-compute-quota
  namespace: batch-jobs
spec:
  hard:
    requests.cpu: "300m"
    requests.memory: 256Mi
    limits.cpu: "600m"
    limits.memory: 512Mi
    count/pods: "6"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-critical-priority-quota
  namespace: prod-critical
spec:
  hard:
    count/pods: "5"
    requests.cpu: "400m"
    requests.memory: 256Mi
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values:
          - critical-production
