apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  namespace: gateway-apps
  labels:
    app.kubernetes.io/name: backend-v1
    app.kubernetes.io/version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-app
      version: v1
  template:
    metadata:
      labels:
        app: backend-app
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: app
          image: gateway-backend-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: "catalog-service-v1"
            - name: SERVICE_VERSION
              value: "v1.0.0"
            - name: COLOR_THEME
              value: "blue"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: v1-service
  namespace: gateway-apps
  labels:
    app: backend-app
    version: v1
spec:
  type: ClusterIP
  selector:
    app: backend-app
    version: v1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
