apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: header-modifier-route
  namespace: gateway-apps
  labels:
    route.tier: response-transform
spec:
  parentRefs:
    - name: production-gateway
      namespace: gateway-infra
  hostnames:
    - "headers.example.local"
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: X-Gateway-Route
                value: "gateway-api-v1"
              - name: X-Proxy-Engine
                value: "Envoy-Gateway"
      backendRefs:
        - name: v1-service
          port: 8080
