apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-operator-manager-role
rules:
  - apiGroups:
      - backup.devops.sre.io
    resources:
      - scheduledbackups
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - backup.devops.sre.io
    resources:
      - scheduledbackups/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - backup.devops.sre.io
    resources:
      - scheduledbackups/finalizers
    verbs:
      - update
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
