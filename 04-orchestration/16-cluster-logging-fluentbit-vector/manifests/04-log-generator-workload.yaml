apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator-workload
  namespace: workload-apps
  labels:
    app.kubernetes.io/name: log-generator-workload
    app.kubernetes.io/part-of: logging-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: log-generator-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-generator-workload
        app.kubernetes.io/part-of: logging-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: log-generator
          image: log-generator-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_INTERVAL_MS
              value: "1000"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
