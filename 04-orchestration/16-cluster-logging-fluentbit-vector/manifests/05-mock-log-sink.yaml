apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-log-sink
  namespace: logging
  labels:
    app.kubernetes.io/name: mock-log-sink
    app.kubernetes.io/component: centralized-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-log-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-log-sink
        app.kubernetes.io/component: centralized-sink
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: sink
          image: log-generator-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mock-log-sink
  namespace: logging
  labels:
    app.kubernetes.io/name: mock-log-sink
spec:
  selector:
    app.kubernetes.io/name: mock-log-sink
  ports:
    - name: http
      port: 8080
      targetPort: 8080
