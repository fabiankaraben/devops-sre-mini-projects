apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssd-workload
  namespace: scheduling-demo
  labels:
    app.kubernetes.io/name: ssd-workload
    scheduling.demo/type: node-selector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ssd-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssd-workload
        scheduling.demo/type: node-selector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      nodeSelector:
        disktype: ssd
      containers:
        - name: workload
          image: workload-reporter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WORKLOAD_TYPE
              value: "node-selector-ssd"
            - name: SCHEDULING_TAG
              value: "disktype=ssd"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
