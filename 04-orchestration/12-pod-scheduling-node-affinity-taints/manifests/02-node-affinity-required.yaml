apiVersion: apps/v1
kind: Deployment
metadata:
  name: strict-affinity-workload
  namespace: scheduling-demo
  labels:
    app.kubernetes.io/name: strict-affinity-workload
    scheduling.demo/type: node-affinity-required
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: strict-affinity-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strict-affinity-workload
        scheduling.demo/type: node-affinity-required
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - zone-a
                      - zone-b
                  - key: environment
                    operator: NotIn
                    values:
                      - legacy
                      - testing
                  - key: disktype
                    operator: Exists
      containers:
        - name: workload
          image: workload-reporter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WORKLOAD_TYPE
              value: "required-node-affinity"
            - name: SCHEDULING_TAG
              value: "zone=zone-a/b && disktype=Exists"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
