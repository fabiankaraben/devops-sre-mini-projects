apiVersion: apps/v1
kind: Deployment
metadata:
  name: soft-affinity-workload
  namespace: scheduling-demo
  labels:
    app.kubernetes.io/name: soft-affinity-workload
    scheduling.demo/type: node-affinity-preferred
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: soft-affinity-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soft-affinity-workload
        scheduling.demo/type: node-affinity-preferred
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: instance-type
                    operator: In
                    values:
                      - high-memory
                      - compute-optimized
            - weight: 20
              preference:
                matchExpressions:
                  - key: tier
                    operator: In
                    values:
                      - spot
      containers:
        - name: workload
          image: workload-reporter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WORKLOAD_TYPE
              value: "preferred-node-affinity"
            - name: SCHEDULING_TAG
              value: "weight-80-high-memory / weight-20-spot"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
