apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-spread-workload
  namespace: scheduling-demo
  labels:
    app.kubernetes.io/name: topology-spread-workload
    scheduling.demo/type: topology-spread
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: topology-spread-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: topology-spread-workload
        scheduling.demo/type: topology-spread
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      # Enforce even distribution across all nodes with maxSkew of 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: topology-spread-workload
      containers:
        - name: workload
          image: workload-reporter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WORKLOAD_TYPE
              value: "topology-spread-workload"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
