apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data-pvc
  namespace: storage-demo
  labels:
    app.kubernetes.io/name: data-state-app
spec:
  storageClassName: csi-expandable-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-state-app
  namespace: storage-demo
  labels:
    app.kubernetes.io/name: data-state-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: data-state-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-state-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: data-state-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATA_DIR
              value: "/data"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: persistent-storage
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: app-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: data-state-app-service
  namespace: storage-demo
  labels:
    app.kubernetes.io/name: data-state-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: data-state-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
