apiVersion: v1
kind: Service
metadata:
  name: stateless-app-service
  namespace: stateless-app-demo
  labels:
    app.kubernetes.io/name: stateless-app
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: devops-sre-mini-projects
    app: stateless-app
spec:
  type: ClusterIP
  selector:
    app: stateless-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
