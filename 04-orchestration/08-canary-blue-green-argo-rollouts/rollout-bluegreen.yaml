apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-bluegreen-app
  namespace: argo-rollouts-demo
  labels:
    app: rollout-bluegreen-app
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rollout-bluegreen-app
  template:
    metadata:
      labels:
        app: rollout-bluegreen-app
    spec:
      containers:
        - name: rollout-app
          image: rollout-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  strategy:
    blueGreen:
      activeService: rollout-active-service
      previewService: rollout-canary-service
      autoPromotionEnabled: false
