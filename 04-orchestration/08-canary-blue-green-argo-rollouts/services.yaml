apiVersion: v1
kind: Service
metadata:
  name: rollout-active-service
  namespace: argo-rollouts-demo
  labels:
    app: rollout-canary-app
    role: active
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: rollout-canary-app
---
apiVersion: v1
kind: Service
metadata:
  name: rollout-canary-service
  namespace: argo-rollouts-demo
  labels:
    app: rollout-canary-app
    role: canary
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: rollout-canary-app
