apiVersion: v1
kind: Pod
metadata:
  name: compliant-secure-pod
  labels:
    app: security-demo
    tier: compliant
spec:
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: hardened-worker
      image: alpine:3.21
      command: ["/bin/sh", "-c", "echo 'Security compliance verified!' && sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
  restartPolicy: Never
