apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: monitored-app-servicemonitor
  namespace: production-apps
  labels:
    app.kubernetes.io/name: monitored-app
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: monitored-app
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
