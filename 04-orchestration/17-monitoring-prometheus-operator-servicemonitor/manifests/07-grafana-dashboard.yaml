apiVersion: v1
kind: ConfigMap
metadata:
  name: monitored-app-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
data:
  monitored-app-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "title": "Application RED Metrics (Rate, Errors, Duration)",
      "tags": ["kubernetes", "prometheus", "sre"],
      "timezone": "UTC",
      "panels": [
        {
          "title": "Request Throughput (RPS)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (code)",
              "legendFormat": "HTTP {{code}}"
            }
          ]
        },
        {
          "title": "HTTP 5xx Error Rate (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{code=~\"5..\"}[1m])) / sum(rate(http_requests_total[1m]))) * 100",
              "legendFormat": "Error Rate %"
            }
          ]
        },
        {
          "title": "P95 & P99 Latency (Seconds)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "P95 Latency"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "P99 Latency"
            }
          ]
        }
      ],
      "schemaVersion": 36,
      "version": 1
    }
