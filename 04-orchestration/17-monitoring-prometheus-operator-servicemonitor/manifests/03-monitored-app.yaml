apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitored-app
  namespace: production-apps
  labels:
    app.kubernetes.io/name: monitored-app
    app.kubernetes.io/component: api-service
    release: prometheus-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monitored-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitored-app
        app.kubernetes.io/component: api-service
        release: prometheus-stack
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: app
          image: monitored-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_NAME
              value: "order-processing-api"
            - name: APP_VERSION
              value: "v1.0.0"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: monitored-app-service
  namespace: production-apps
  labels:
    app.kubernetes.io/name: monitored-app
    release: prometheus-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: monitored-app
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
      protocol: TCP
