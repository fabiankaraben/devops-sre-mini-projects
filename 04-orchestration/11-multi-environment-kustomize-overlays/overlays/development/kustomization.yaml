apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: dev-
namespace: dev-environment

labels:
  - pairs:
      environment: development
      tier: test

resources:
  - ../../base

replicas:
  - name: payment-service
    count: 1

configMapGenerator:
  - name: payment-config
    behavior: replace
    envs:
      - config/dev.properties

secretGenerator:
  - name: payment-secrets
    envs:
      - config/secret.env

patches:
  - path: deployment-patch.yaml
