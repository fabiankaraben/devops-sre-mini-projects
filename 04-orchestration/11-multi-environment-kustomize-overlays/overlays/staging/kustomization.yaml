apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: staging-
namespace: staging-environment

labels:
  - pairs:
      environment: staging
      tier: pre-production

resources:
  - ../../base

replicas:
  - name: payment-service
    count: 2

configMapGenerator:
  - name: payment-config
    behavior: replace
    envs:
      - config/staging.properties

secretGenerator:
  - name: payment-secrets
    envs:
      - config/secret.env

patches:
  - path: deployment-patch.yaml
