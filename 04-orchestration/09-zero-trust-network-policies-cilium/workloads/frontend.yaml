apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tenant-frontend
  labels:
    app: frontend
    tier: frontend
    tenant: zero-trust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
        tenant: zero-trust
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: frontend
          image: zero-trust-app:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/frontend"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BACKEND_URL
              value: "http://backend.tenant-backend.svc.cluster.local:8080"
            - name: DB_HOST
              value: "database.tenant-database.svc.cluster.local:5432"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tenant-frontend
  labels:
    app: frontend
    tier: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: frontend
