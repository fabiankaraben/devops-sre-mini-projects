apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: config-reloading-demo
  labels:
    app.kubernetes.io/name: config-reloading-app
    app.kubernetes.io/part-of: devops-sre-mini-projects
data:
  # Scalar configuration keys for environment variable injection
  APP_NAME: "Microservice-Alpha"
  ENVIRONMENT: "staging"
  LOG_LEVEL: "INFO"
  THEME: "dark-mode"
  FEATURE_FLAG_ANALYTICS: "true"

  # Structured configuration file for volume mounting
  settings.json: |
    {
      "database": {
        "pool_size": 25,
        "timeout_seconds": 5,
        "read_replica_enabled": true
      },
      "cache": {
        "provider": "redis",
        "ttl_seconds": 3600,
        "cluster_mode": false
      },
      "rate_limiting": {
        "enabled": true,
        "max_requests_per_minute": 1200
      }
    }
