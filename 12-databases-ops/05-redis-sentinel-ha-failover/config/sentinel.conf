# ==============================================================================
# Redis Sentinel Configuration Template (Reference)
# ==============================================================================

port 26379
dir /tmp
protected-mode no

# Enable hostname resolution for containerized Docker networks
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Monitor 'mymaster' on redis-master:6379 with a quorum of 2
sentinel monitor mymaster redis-master 6379 2

# Consider master subjectively down after 2000 milliseconds (2 seconds)
sentinel down-after-milliseconds mymaster 2000

# Failover timeout in milliseconds (5 seconds)
sentinel failover-timeout mymaster 5000

# How many replicas can be reconfigured in parallel to replicate from new master
sentinel parallel-syncs mymaster 1
