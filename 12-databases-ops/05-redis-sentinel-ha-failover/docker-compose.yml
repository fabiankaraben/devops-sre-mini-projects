services:
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    restart: unless-stopped
    command: ["redis-server", "--protected-mode", "no", "--appendonly", "yes"]
    ports:
      - "${REDIS_MASTER_PORT:-6379}:6379"
    networks:
      - redis-sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-replica-1
    restart: unless-stopped
    command: ["redis-server", "--protected-mode", "no", "--appendonly", "yes", "--replicaof", "redis-master", "6379"]
    ports:
      - "${REDIS_REPLICA1_PORT:-6380}:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - redis-sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  redis-replica-2:
    image: redis:7-alpine
    container_name: redis-replica-2
    restart: unless-stopped
    command: ["redis-server", "--protected-mode", "no", "--appendonly", "yes", "--replicaof", "redis-master", "6379"]
    ports:
      - "${REDIS_REPLICA2_PORT:-6381}:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - redis-sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/redis
        cat << 'EOF' > /etc/redis/sentinel.conf
        port 26379
        dir /tmp
        protected-mode no
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor mymaster redis-master 6379 2
        sentinel down-after-milliseconds mymaster 2000
        sentinel failover-timeout mymaster 5000
        sentinel parallel-syncs mymaster 1
        EOF
        exec redis-sentinel /etc/redis/sentinel.conf
    ports:
      - "${SENTINEL_1_PORT:-26379}:26379"
    networks:
      - redis-sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/redis
        cat << 'EOF' > /etc/redis/sentinel.conf
        port 26379
        dir /tmp
        protected-mode no
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor mymaster redis-master 6379 2
        sentinel down-after-milliseconds mymaster 2000
        sentinel failover-timeout mymaster 5000
        sentinel parallel-syncs mymaster 1
        EOF
        exec redis-sentinel /etc/redis/sentinel.conf
    ports:
      - "${SENTINEL_2_PORT:-26380}:26379"
    networks:
      - redis-sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/redis
        cat << 'EOF' > /etc/redis/sentinel.conf
        port 26379
        dir /tmp
        protected-mode no
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor mymaster redis-master 6379 2
        sentinel down-after-milliseconds mymaster 2000
        sentinel failover-timeout mymaster 5000
        sentinel parallel-syncs mymaster 1
        EOF
        exec redis-sentinel /etc/redis/sentinel.conf
    ports:
      - "${SENTINEL_3_PORT:-26381}:26379"
    networks:
      - redis-sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

networks:
  redis-sentinel-net:
    name: redis-sentinel-net
    driver: bridge
