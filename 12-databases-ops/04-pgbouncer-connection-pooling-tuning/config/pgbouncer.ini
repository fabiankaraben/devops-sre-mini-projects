[databases]
* = host=postgres-db port=5432 auth_user=postgres
benchmark_db = host=postgres-db port=5432 dbname=benchmark_db auth_user=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

admin_users = postgres, pgbouncer_admin
stats_users = postgres, pgbouncer_admin, pgbouncer_monitor

# ==============================================================================
# Connection Pool Tuning Parameters
# ==============================================================================
# pool_mode:
#   - session: server connection held for client session duration
#   - transaction: server connection released immediately after COMMIT/ROLLBACK
#   - statement: server connection released after each SQL statement
pool_mode = transaction

# Maximum simultaneous client connections that PgBouncer will accept
max_client_conn = 1000

# Default number of backend server connections allowed per (user, database) pool
default_pool_size = 20

# Minimum server connections to keep open in the pool to avoid cold-connect latency
min_pool_size = 5

# Extra server connections allowed when default_pool_size is saturated
reserve_pool_size = 5
reserve_pool_timeout = 5

# Maximum backend server connections across all pools for this database
max_db_connections = 50

# ==============================================================================
# Timeouts & TCP Keepalive Tuning
# ==============================================================================
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120

# Low-level buffer & socket settings
pkt_buf = 4096
max_packet_size = 2147483647
listen_backlog = 128
