apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-ha-cluster
  namespace: default
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  storage:
    size: 1Gi

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  bootstrap:
    initdb:
      database: ecommerce_db
      owner: app_user
      secret:
        name: db-credentials

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      log_min_duration_statement: "50"

  backup:
    barmanObjectStore:
      destinationPath: "s3://pg-wal-archives/"
      endpointURL: "http://minio-service:9000"
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: s3-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
