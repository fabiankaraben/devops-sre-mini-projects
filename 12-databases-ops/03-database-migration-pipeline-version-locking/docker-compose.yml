services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-migration-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-migration_test_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_migration_data:/var/lib/postgresql/data
      - postgres_migration_files:/migrations_data
    networks:
      - postgres-migration-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-migration_test_db}"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s

volumes:
  postgres_migration_data:
    name: postgres_migration_data
  postgres_migration_files:
    name: postgres_migration_files

networks:
  postgres-migration-net:
    name: postgres-migration-net
    driver: bridge
