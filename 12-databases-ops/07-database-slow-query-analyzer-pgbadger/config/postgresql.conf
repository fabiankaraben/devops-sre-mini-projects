# ==============================================================================
# PostgreSQL Slow Query & Performance Logging Configuration for pgBadger
# ==============================================================================

# Connection settings
listen_addresses = '*'
max_connections = 100

# Memory settings (deliberately constrained work_mem to demonstrate disk sort spills)
shared_buffers = 128MB
work_mem = 64kB

# Logging Collector & Destination
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql.log'
log_file_mode = 0644
log_truncate_on_rotation = off

# Recommended pgBadger Log Line Prefix (Strict format required for pgBadger parser)
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Query Duration Threshold (Logs any query taking >= 20ms)
log_min_duration_statement = 20

# Performance, Lock & I/O Diagnostics
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# Extensions
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = 'all'
