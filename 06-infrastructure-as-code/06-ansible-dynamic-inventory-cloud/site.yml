---
# ==============================================================================
# site.yml - Master Fleet Baseline Configuration Playbook
# ==============================================================================
# Provisions and harmonizes baseline configurations across dynamically
# discovered host tiers (Web, API, Database).
# ==============================================================================

- name: "Configure Web Tier Fleet"
  hosts: role_web
  gather_facts: false
  vars:
    app_max_connections: 500
    app_log_level: "INFO"
  roles:
    - role: fleet_app

- name: "Configure API Tier Fleet"
  hosts: role_api
  gather_facts: false
  vars:
    app_max_connections: 300
    app_log_level: "DEBUG"
  roles:
    - role: fleet_app

- name: "Configure Database Tier Fleet"
  hosts: role_db
  gather_facts: false
  vars:
    app_max_connections: 100
    app_log_level: "WARN"
  roles:
    - role: fleet_app
