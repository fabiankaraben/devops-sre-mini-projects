---
# ==============================================================================
# Tasks for roles/fleet_app
# ==============================================================================

- name: "Ensure application runtime directory exists"
  ansible.builtin.file:
    path: "{{ app_config_dir }}"
    state: directory
    mode: "0755"

- name: "Deploy updated application configuration"
  ansible.builtin.template:
    src: "config.json.j2"
    dest: "{{ app_config_file }}"
    mode: "0644"
  notify: "reload fleet app service"

- name: "Deploy application version metadata"
  ansible.builtin.copy:
    content: "{{ app_target_version }}\n"
    dest: "{{ app_version_file }}"
    mode: "0644"
  notify: "reload fleet app service"

- name: "Flush pending handlers to apply configuration update"
  ansible.builtin.meta: flush_handlers
