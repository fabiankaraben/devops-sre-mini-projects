services:
  burn-rate-simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    image: sre-burn-rate-simulator:latest
    container_name: burn-rate-simulator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\")' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - sre-burn-rate-net

  alertmanager:
    build:
      context: .
      dockerfile: Dockerfile.alertmanager
    image: alertmanager-sre-stack:v0.27.0
    container_name: alertmanager-sre
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_sre_data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - sre-burn-rate-net

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    image: prometheus-burn-rate-stack:v2.54.1
    container_name: prometheus-burn-rate
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    volumes:
      - prometheus_burn_rate_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 3s
    depends_on:
      burn-rate-simulator:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    networks:
      - sre-burn-rate-net

networks:
  sre-burn-rate-net:
    driver: bridge
    name: sre-burn-rate-net

volumes:
  prometheus_burn_rate_data:
    name: prometheus_burn_rate_data
  alertmanager_sre_data:
    name: alertmanager_sre_data
