apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-api-code
  namespace: chaos-lab
data:
  server.py: |
    import http.server
    import json
    import os
    import random
    import socketserver
    import time

    PORT = int(os.environ.get("PORT", 8080))
    POD_NAME = os.environ.get("POD_NAME", "unknown-pod")
    NODE_NAME = os.environ.get("NODE_NAME", "unknown-node")

    class PaymentHandler(http.server.BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _send_json(self, status_code, data):
            payload = json.dumps(data, indent=2).encode("utf-8")
            self.send_response(status_code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.send_header("Connection", "close")
            self.send_header("X-Pod-Name", POD_NAME)
            self.send_header("X-Node-Name", NODE_NAME)
            self.end_headers()
            self.wfile.write(payload)
            self.close_connection = True

        def do_GET(self):
            path = self.path.split("?")[0]
            if path in ("/healthz", "/readyz", "/health"):
                self._send_json(200, {
                    "status": "HEALTHY",
                    "pod": POD_NAME,
                    "node": NODE_NAME,
                })
            elif path.startswith("/api/v1/checkout") or path.startswith("/checkout"):
                # Simulate realistic processing latency (5ms - 15ms)
                delay = random.uniform(0.005, 0.015)
                time.sleep(delay)
                self._send_json(200, {
                    "status": "APPROVED",
                    "transaction_id": f"txn_{int(time.time()*1000)}_{random.randint(1000, 9999)}",
                    "pod_name": POD_NAME,
                    "node_name": NODE_NAME,
                    "latency_ms": round(delay * 1000.0, 2),
                    "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                })
            else:
                self._send_json(200, {
                    "message": "Payment API Gateway",
                    "pod": POD_NAME,
                    "node": NODE_NAME,
                    "endpoints": ["/healthz", "/api/v1/checkout"],
                })

        def do_POST(self):
            self.do_GET()

        def log_message(self, format, *args):
            pass

    class ThreadedServer(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True
        allow_reuse_address = True

    if __name__ == "__main__":
        server = ThreadedServer(("0.0.0.0", PORT), PaymentHandler)
        print(f"Payment API listening on port {PORT} in pod {POD_NAME} on node {NODE_NAME}", flush=True)
        server.serve_forever()
