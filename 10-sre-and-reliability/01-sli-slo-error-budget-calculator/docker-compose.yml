services:
  mock-service:
    build:
      context: .
      dockerfile: Dockerfile.mock
    image: sre-mock-metrics:latest
    container_name: mock-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\")' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - sre-calculator-net

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    image: prometheus-sre-stack:v2.54.1
    container_name: prometheus-sre
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - prometheus_sre_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 3s
    depends_on:
      mock-service:
        condition: service_healthy
    networks:
      - sre-calculator-net

networks:
  sre-calculator-net:
    driver: bridge
    name: sre-calculator-net

volumes:
  prometheus_sre_data:
    name: prometheus_sre_data
