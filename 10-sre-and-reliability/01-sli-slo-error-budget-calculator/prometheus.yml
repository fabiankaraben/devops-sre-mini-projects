# ==============================================================================
# Prometheus Configuration for SRE SLI/SLO Monitoring Stack
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

# Load recording and alerting rules
rule_files:
  - "rules/slo_recording_rules.yml"

scrape_configs:
  # Scrape the synthetic microservices traffic generator
  - job_name: "mock-microservices"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "mock-service:8080"
          - "localhost:8080"
        labels:
          environment: "local-simulation"
          cluster: "sre-lab-01"

  # Scrape Prometheus internal metrics
  - job_name: "prometheus-server"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          environment: "local-simulation"
          role: "monitoring"
