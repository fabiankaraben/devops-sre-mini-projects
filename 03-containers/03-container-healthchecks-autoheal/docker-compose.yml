# ==============================================================================
# Container Healthchecks & Autoheal Engine Orchestration
# ==============================================================================
# Demonstrates:
#   1. Flaky microservice with active container healthchecks probing /health
#   2. Sidecar Autoheal Daemon monitoring /var/run/docker.sock for unhealthy events
# ==============================================================================

name: devops-mini-proj-03-03

services:
  # ----------------------------------------------------------------------------
  # 1. Target Microservice with Native Healthcheck
  # ----------------------------------------------------------------------------
  flaky-service:
    build:
      context: ./flaky_app
      dockerfile: Dockerfile
    container_name: autoheal-flaky-service
    ports:
      - "${PORT_APP:-8091}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 4s
      timeout: 2s
      retries: 2
      start_period: 2s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 2. Autoheal Watcher Daemon (Sidecar Socket Monitor)
  # ----------------------------------------------------------------------------
  autoheal-daemon:
    build:
      context: .
      dockerfile: autoheal_daemon/Dockerfile
    container_name: autoheal-daemon-watcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_COOLDOWN=6
      - PYTHONUNBUFFERED=1
    depends_on:
      - flaky-service
    restart: unless-stopped
