# ==============================================================================
# Envoy L7 Edge Router Configuration: Canary Traffic Shifting & Circuit Breaking
# ==============================================================================
# Features:
#   1. Weighted Canary Traffic Shifting (90% service_v1 / 10% service_v2)
#   2. Header-Based Canary Overrides (x-canary: true -> 100% service_v2)
#   3. Automatic Outlier Detection Circuit Breaking on Consecutive 5xx Errors
#   4. Dynamic Connection Pool Circuit Breaker Limits
#   5. Admin Interface & Prometheus Metrics on Port 9901
# ==============================================================================

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: ingress_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: canary_route_config
            virtual_hosts:
            - name: canary_edge_service
              domains: ["*"]
              routes:
              # ----------------------------------------------------------------
              # 1. Healthcheck Direct Endpoint
              # ----------------------------------------------------------------
              - match:
                  path: "/health"
                direct_response:
                  status: 200
                  body:
                    inline_string: '{"status":"healthy","service":"envoy-canary-router","engine":"envoy-v1.31"}'

              # ----------------------------------------------------------------
              # 2. Header-Based Canary Override Route (x-canary: true)
              # ----------------------------------------------------------------
              - match:
                  prefix: "/api/"
                  headers:
                  - name: "x-canary"
                    string_match:
                      exact: "true"
                route:
                  cluster: service_v2
                  timeout: 5s
                response_headers_to_add:
                - header:
                    key: "x-envoy-routing-rule"
                    value: "header-canary-override"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD

              # ----------------------------------------------------------------
              # 3. Default Weighted Canary Route (90% v1 / 10% v2) with Auto-Retry
              # ----------------------------------------------------------------
              - match:
                  prefix: "/api/"
                route:
                  weighted_clusters:
                    clusters:
                    - name: service_v1
                      weight: 90
                    - name: service_v2
                      weight: 10
                  timeout: 5s
                  retry_policy:
                    retry_on: "5xx,connect-failure,refused-stream"
                    num_retries: 3
                    retry_back_off:
                      base_interval: 0.025s
                      max_interval: 0.1s
                response_headers_to_add:
                - header:
                    key: "x-envoy-routing-rule"
                    value: "weighted-canary-split"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD

              # ----------------------------------------------------------------
              # 4. Direct Inspection Endpoints for Testing & Dashboard
              # ----------------------------------------------------------------
              - match:
                  prefix: "/v1/"
                route:
                  prefix_rewrite: "/api/"
                  cluster: service_v1
                  timeout: 5s

              - match:
                  prefix: "/v2/"
                route:
                  prefix_rewrite: "/api/"
                  cluster: service_v2
                  timeout: 5s

              # ----------------------------------------------------------------
              # 5. Interactive SRE Web Dashboard Route
              # ----------------------------------------------------------------
              - match:
                  prefix: "/"
                route:
                  cluster: dashboard_service
                  timeout: 5s

          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # ============================================================================
  # Cluster: Stable Backend Service (v1.0.0)
  # ============================================================================
  - name: service_v1
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    connect_timeout: 2s
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 2048
        max_requests: 2048
        max_pending_requests: 2048
    load_assignment:
      cluster_name: service_v1
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: service_v1
                port_value: 8001

  # ============================================================================
  # Cluster: Experimental Canary Backend Service (v2.0.0-canary)
  # Equipped with Outlier Detection & Circuit Breaker Limits
  # ============================================================================
  - name: service_v2
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    connect_timeout: 2s
    common_lb_config:
      healthy_panic_threshold:
        value: 0.0
    outlier_detection:
      consecutive_5xx: 3
      interval: 1s
      base_ejection_time: 3s
      max_ejection_time: 4s
      max_ejection_percent: 100
      enforcing_consecutive_5xx: 100
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 2048
        max_requests: 2048
        max_pending_requests: 2048
    load_assignment:
      cluster_name: service_v2
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: service_v2
                port_value: 8002

  # ============================================================================
  # Cluster: Interactive Web Dashboard
  # ============================================================================
  - name: dashboard_service
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    connect_timeout: 2s
    load_assignment:
      cluster_name: dashboard_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: canary-dashboard
                port_value: 8080
