events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured logging with client IP, request time, and upstream timing metrics
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance optimizations for static file transfer
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # =========================================================================
    # 1. Gzip Compression Configuration
    # =========================================================================
    # Compresses text, css, javascript, and json payloads on the fly to save bandwidth
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/ld+json
        image/svg+xml;

    # =========================================================================
    # 2. Upstream Dynamic Backend Definition
    # =========================================================================
    upstream mock_api_backend {
        # 'mock-api' resolves via Docker internal DNS network
        server mock-api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Standard security and educational identification headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Proxy-By "Nginx-Reverse-Proxy-MiniProject" always;

        # =====================================================================
        # 3. Static Assets with Aggressive Client Caching (1 Year)
        # =====================================================================
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Proxy-By "Nginx-Reverse-Proxy-MiniProject" always;
            access_log off;
            try_files $uri =404;
        }

        # =====================================================================
        # 4. Root and HTML Files (No-Cache to ensure immediate updates)
        # =====================================================================
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Proxy-By "Nginx-Reverse-Proxy-MiniProject" always;
        }

        # =====================================================================
        # 5. Reverse Proxy: Dynamic API Routing
        # =====================================================================
        # Routes all /api/* requests to the upstream Python backend
        location /api/ {
            # Trailing slash strips '/api/' prefix when forwarding to backend
            proxy_pass http://mock_api_backend/;

            # HTTP/1.1 and keepalive connection reuse
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward original client and request headers to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Upstream timeouts and buffering
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 8k;

            # Intercept upstream errors (e.g. 500, 502) to display custom error page
            proxy_intercept_errors on;
        }

        # =====================================================================
        # 6. Custom Error Pages
        # =====================================================================
        error_page 404 /404.html;
        location = /404.html {
            internal;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache" always;
            add_header X-Proxy-By "Nginx-Reverse-Proxy-MiniProject" always;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache" always;
            add_header X-Proxy-By "Nginx-Reverse-Proxy-MiniProject" always;
        }
    }
}
