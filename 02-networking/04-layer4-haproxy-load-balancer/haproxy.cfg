# ==============================================================================
# HAProxy Layer 4 (TCP) Load Balancer Configuration
# ==============================================================================
# Highlights:
#  1. Layer 4 (TCP mode) connection load balancing on port 9000
#  2. Round-robin distribution algorithm across a 3-node backend pool
#  3. Active TCP health checking (inter 1500ms, fall 2, rise 2)
#  4. Automatic session redispatch on connection failure (zero dropped requests)
#  5. HAProxy Web Statistics Dashboard on port 8404 with live health telemetry
#  6. Robust connection and server timeouts
# ==============================================================================

global
    log stdout format raw local0 info
    maxconn 4096
    stats socket /tmp/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    option  redispatch
    retries 3
    timeout connect 3000ms
    timeout client  50000ms
    timeout server  50000ms

# ==============================================================================
# 1. HAProxy Web Statistics Dashboard
# ==============================================================================
frontend stats_front
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
    stats show-node
    stats auth admin:admin123
    stats admin if TRUE

# ==============================================================================
# 2. Layer 4 TCP Frontend (Port 9000)
# ==============================================================================
frontend tcp_front
    bind *:9000
    mode tcp
    default_backend tcp_backend_pool

# ==============================================================================
# 3. Layer 4 Backend Pool (3 Replicated Instances)
# ==============================================================================
backend tcp_backend_pool
    mode tcp
    balance roundrobin

    # Active TCP Health Checks:
    # - inter 1500ms : probe every 1.5 seconds
    # - fall 2       : mark server DOWN after 2 consecutive failed probes (3s)
    # - rise 2       : mark server UP after 2 consecutive successful probes (3s)
    default-server check inter 1500ms fall 2 rise 2 weight 10 maxconn 1000

    server backend-1 backend-1:8000
    server backend-2 backend-2:8000
    server backend-3 backend-3:8000
