services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rate-limit-api
    restart: unless-stopped
    networks:
      - gateway-net

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: rate-limit-gateway
    restart: unless-stopped
    ports:
      - "8085:80"
      - "8888:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gateway-net

networks:
  gateway-net:
    name: rate-limit-gateway-net
    driver: bridge
