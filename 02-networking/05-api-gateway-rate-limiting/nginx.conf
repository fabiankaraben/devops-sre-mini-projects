# ==============================================================================
# Nginx API Gateway with Leaky-Bucket Rate Limiting Configuration
# ==============================================================================
# Highlights:
#  1. Shared-memory Leaky-Bucket rate limiting zones (limit_req_zone)
#  2. Granular per-endpoint rate limits (Strict Auth, Standard API, Heavy Upload)
#  3. Burst allowances with 'nodelay' for low-latency burst handling
#  4. Custom HTTP 429 (Too Many Requests) & HTTP 413 (Payload Too Large) JSON errors
#  5. Injected Rate-Limiting Diagnostic Headers (X-RateLimit-Policy, Retry-After)
#  6. Payload size limits (client_max_body_size 1M)
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Custom log format tracking client rate limiting status
    log_format rate_limited '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            'pipe="$pipe" rt=$request_time '
                            'zone="$limit_req_status" '
                            'upstream="$upstream_response_time"';

    access_log /var/log/nginx/access.log rate_limited;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # ==========================================================================
    # Leaky-Bucket Rate Limiting Shared Memory Zones
    # ==========================================================================
    # $binary_remote_addr uses 4 bytes per IPv4 (16 bytes for IPv6) in shared memory
    # 10MB zone can hold ~160,000 unique IP states simultaneously

    # 1. Standard API Zone: 10 requests per second (1 request every 100ms)
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=10r/s;

    # 2. Strict Auth / Login Zone: 2 requests per second (1 request every 500ms)
    limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=2r/s;

    # 3. Upload Zone: 1 request per second
    limit_req_zone $binary_remote_addr zone=api_upload_limit:10m rate=1r/s;

    # Return standard HTTP 429 Too Many Requests (instead of default 503 Service Unavailable)
    limit_req_status 429;
    limit_conn_status 429;

    # Upstream API backend service
    upstream downstream_api {
        server api:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Gateway health check
        location /gateway-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"nginx-api-gateway"}\n';
        }

        # ----------------------------------------------------------------------
        # Custom JSON Error Handlers (HTTP 429 and HTTP 413)
        # ----------------------------------------------------------------------
        error_page 429 = @rate_limit_exceeded;
        error_page 413 = @payload_too_large;

        location @rate_limit_exceeded {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header X-RateLimit-Status "Rate Limit Exceeded" always;
            add_header X-Gateway-By "Nginx-Leaky-Bucket" always;
            return 429 '{"error":"Too Many Requests","status":429,"message":"Rate limit exceeded. Leaky bucket capacity reached. Please wait before retrying.","retry_after_seconds":1}\n';
        }

        location @payload_too_large {
            default_type application/json;
            add_header X-Gateway-By "Nginx-Leaky-Bucket" always;
            return 413 '{"error":"Payload Too Large","status":413,"message":"Request body exceeds the maximum permitted size limit of 1MB."}\n';
        }

        # ----------------------------------------------------------------------
        # 1. Strict Auth Endpoint Rate Limiting (/api/v1/auth/*)
        # ----------------------------------------------------------------------
        location /api/v1/auth/ {
            # Leaky-bucket: 2r/s rate, permits burst up to 3 requests without delay
            limit_req zone=api_auth_limit burst=3 nodelay;

            add_header X-RateLimit-Policy "2 requests/sec, burst=3 (Auth Zone)" always;

            proxy_pass http://downstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 2. Heavy Uploads (/api/v1/upload) with Payload Size Limit
        # ----------------------------------------------------------------------
        location /api/v1/upload {
            # Strict 1MB max body size
            client_max_body_size 1m;

            # Leaky-bucket: 1r/s rate, burst 2
            limit_req zone=api_upload_limit burst=2 nodelay;

            add_header X-RateLimit-Policy "1 request/sec, burst=2, max_body=1MB" always;

            proxy_pass http://downstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # 3. General REST API Endpoints (/api/v1/*)
        # ----------------------------------------------------------------------
        location /api/v1/ {
            # Leaky-bucket: 10r/s rate, permits burst up to 10 requests without delay
            limit_req zone=api_general_limit burst=10 nodelay;

            add_header X-RateLimit-Policy "10 requests/sec, burst=10 (General API Zone)" always;

            proxy_pass http://downstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 4. Interactive Visual Dashboard & Root
        # ----------------------------------------------------------------------
        location / {
            # Light rate limit on dashboard requests
            limit_req zone=api_general_limit burst=20 nodelay;

            proxy_pass http://downstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
