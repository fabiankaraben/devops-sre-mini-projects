# ==============================================================================
# Nginx Shadow Traffic Mirroring Configuration
# ==============================================================================
# Uses ngx_http_mirror_module to asynchronously duplicate all /api/ traffic
# to the shadow backend without impacting client response time or latency.
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Custom log format tracking upstream response times and shadow mirroring
    log_format shadow_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               'rt=$request_time uct="$upstream_connect_time" '
                               'uht="$upstream_header_time" urt="$upstream_response_time" '
                               'req_id="$request_id"';

    access_log /var/log/nginx/access.log shadow_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ==========================================================================
    # Upstream Clusters
    # ==========================================================================
    upstream primary_backend {
        server primary-api:8001;
        keepalive 32;
    }

    upstream shadow_backend {
        server shadow-api:8002;
        keepalive 32;
    }

    # ==========================================================================
    # Reverse Proxy Server
    # ==========================================================================
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ----------------------------------------------------------------------
        # 1. Primary API Route with Asynchronous Traffic Mirroring
        # ----------------------------------------------------------------------
        location /api/ {
            # Asynchronously duplicate all incoming requests to the internal /mirror endpoint
            mirror /mirror;
            mirror_request_body on;

            # Forward original request to Primary Production backend
            proxy_pass http://primary_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Custom response headers exposing production routing & tracking
            add_header X-Primary-Backend "primary-api-v1" always;
            add_header X-Request-ID $request_id always;
            add_header X-Shadow-Mirror "active" always;
        }

        # ----------------------------------------------------------------------
        # 2. Internal Mirror Route (Shadow Backend Destination)
        # ----------------------------------------------------------------------
        location = /mirror {
            internal;

            # Forward mirrored request copy to Shadow Experimental backend
            proxy_pass http://shadow_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass_request_body on;

            # Inject metadata headers identifying mirrored traffic
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Shadow-Mirror "true";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Request-ID $request_id;

            # Aggressive timeouts to prevent slow shadow backend from consuming resources
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_ignore_client_abort on;
        }

        # ----------------------------------------------------------------------
        # 3. Direct Management & Inspection Endpoints for Web Dashboard
        # ----------------------------------------------------------------------
        location /primary/ {
            rewrite ^/primary/(.*)$ /$1 break;
            proxy_pass http://primary_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /shadow/ {
            rewrite ^/shadow/(.*)$ /$1 break;
            proxy_pass http://shadow_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ----------------------------------------------------------------------
        # 4. Web Dashboard Visualizer UI
        # ----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ----------------------------------------------------------------------
        # 5. Health & Proxy Status Check
        # ----------------------------------------------------------------------
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"mirror-proxy","engine":"nginx","mirror_module":true}\n';
        }
    }
}
