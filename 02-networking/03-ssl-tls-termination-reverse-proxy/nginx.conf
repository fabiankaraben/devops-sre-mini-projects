# ==============================================================================
# Nginx SSL/TLS Termination Reverse Proxy Configuration
# ==============================================================================
# Highlights:
#  1. HTTP-to-HTTPS permanent 301 redirection on Port 80
#  2. Strict TLS 1.3 & TLS 1.2 support with modern secure cipher suites
#  3. SSL Session Caching & Session Resumption (shared memory 10MB, 1 day timeout)
#  4. Diffie-Hellman 2048-bit parameter key exchange (DHE)
#  5. Strict Transport Security (HSTS) with 2-year max-age, subdomains & preload
#  6. Advanced Security Headers (CSP, X-Frame-Options, X-Content-Type-Options)
#  7. Clean HTTP/1.1 upstream proxying with injected SSL handshake metadata
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format including TLS protocol, cipher, and upstream response time
    log_format ssl_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'protocol="$ssl_protocol" cipher="$ssl_cipher" '
                            'session_reused="$ssl_session_reused" '
                            'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log ssl_combined;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ==========================================================================
    # Global SSL/TLS Configuration (Mozilla Modern & Intermediate Profile)
    # ==========================================================================
    # Enable modern TLS versions only (Disallow insecure SSLv3, TLS 1.0, TLS 1.1)
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;

    # Modern TLS 1.3 Ciphersuites (RFC 8446)
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;

    # Strong TLS 1.2 Cipher Suites with Forward Secrecy (ECDHE / DHE)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # SSL Session Optimization & Resumption
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_PROXY:10m; # ~40,000 cached SSL sessions
    ssl_session_tickets off;               # Enforces Perfect Forward Secrecy (PFS)

    # Diffie-Hellman Parameters for DHE ciphers
    ssl_dhparam /etc/nginx/certs/dhparam.pem;

    # ==========================================================================
    # Upstream Backend Pool
    # ==========================================================================
    upstream backend_nodes {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ==========================================================================
    # 1. HTTP Server - Port 80 (Mandatory Redirect to HTTPS)
    # ==========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Healthcheck endpoint allowed over HTTP for load balancers
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # Enforce HTTP to HTTPS 301 Permanent Redirect
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # 2. HTTPS Server - Port 443 (SSL/TLS Termination)
    # ==========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost app.internal app.local 127.0.0.1;

        # Server Certificate & Private Key
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # ----------------------------------------------------------------------
        # HTTP Security Headers
        # ----------------------------------------------------------------------
        # HTTP Strict Transport Security (HSTS) - 2 years max-age
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Prevent clickjacking attacks
        add_header X-Frame-Options DENY always;

        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options nosniff always;

        # Referrer Policy
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Content Security Policy (CSP)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;" always;

        # Custom SRE Diagnostic Header
        add_header X-Proxy-By "Nginx-TLS-Termination" always;

        # ----------------------------------------------------------------------
        # Proxy Pass to Plaintext Backend
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;

            # Connection reuse
            proxy_set_header Connection "";

            # Standard Forwarded Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Host $host;

            # SSL/TLS Handshake Diagnostic Metadata for Backend
            proxy_set_header X-SSL-Protocol $ssl_protocol;
            proxy_set_header X-SSL-Cipher $ssl_cipher;
            proxy_set_header X-SSL-Session-Reused $ssl_session_reused;
            proxy_set_header X-SSL-Server-Name $ssl_server_name;

            # Timeouts and Buffer settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # Dedicated proxy health check
        location /health {
            proxy_pass http://backend_nodes/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
