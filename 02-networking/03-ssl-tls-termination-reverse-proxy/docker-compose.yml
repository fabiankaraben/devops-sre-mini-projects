services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ssl-backend-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - ssl-proxy-net

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: ssl-termination-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8088:80"
      - "8443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - ssl-proxy-net

networks:
  ssl-proxy-net:
    name: ssl-proxy-internal-net
    driver: bridge
