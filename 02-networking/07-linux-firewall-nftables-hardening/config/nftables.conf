#!/usr/sbin/nft -f
# ==============================================================================
# Linux Firewall Hardening with nftables Ruleset
# ==============================================================================
# Features:
#   1. Zero-Trust Default-Drop Policy on Ingress and Forwarding
#   2. Stateful Connection Tracking (conntrack established/related)
#   3. Deep Packet Inspection & Invalid Packet Dropping
#   4. Anti-IP Spoofing and Bogus Network Filtering
#   5. TCP Flag Anomaly & Malformed Packet Scanning Defenses (Null, Xmas, SYN-FIN)
#   6. ICMP Echo Flood Rate Limiting (5 req/sec with burst 10)
#   7. SYN Flood Ingress Rate Limiting on Public Web Endpoints
#   8. Dynamic Port-Scan Honeypot Traps with Auto-Blacklisting (1m ban)
#   9. Granular SRE Named Counters for Observability and Metrics
# ==============================================================================

flush ruleset

table inet filter {
    # --------------------------------------------------------------------------
    # Dynamic Sets: Auto-Blacklisted Port Scanners
    # --------------------------------------------------------------------------
    set portscan_blacklist {
        type ipv4_addr
        size 65535
        flags dynamic, timeout
        timeout 1m
    }

    # --------------------------------------------------------------------------
    # SRE Observability Counters
    # --------------------------------------------------------------------------
    counter cnt_established { }
    counter cnt_invalid_drop { }
    counter cnt_bad_flags_drop { }
    counter cnt_spoofed_drop { }
    counter cnt_icmp_flood_drop { }
    counter cnt_syn_flood_drop { }
    counter cnt_portscan_drop { }
    counter cnt_default_drop { }

    # --------------------------------------------------------------------------
    # Ingress Filter Chain
    # --------------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Allow local loopback interface
        iifname "lo" accept

        # 2. Block and drop dynamically blacklisted port scanners
        ip saddr @portscan_blacklist counter name "cnt_portscan_drop" drop

        # 3. ICMP Echo Request Rate Limiting (evaluated for all echo requests: 5/sec, burst 10)
        ip protocol icmp icmp type echo-request limit rate 5/second burst 10 packets accept
        ip protocol icmp icmp type echo-request counter name "cnt_icmp_flood_drop" drop

        # 4. Fast-path: Accept established and related stateful connections
        ct state established,related counter name "cnt_established" accept

        # 5. Drop invalid state packets (corrupt or desynchronized)
        ct state invalid counter name "cnt_invalid_drop" drop

        # 6. Anti-Spoofing: Drop loopback/bogon source IPs arriving on non-lo interface
        iifname != "lo" ip saddr { 0.0.0.0/8, 127.0.0.0/8, 240.0.0.0/4 } counter name "cnt_spoofed_drop" drop

        # 7. TCP Flag Anomaly Defenses
        # Null Scan (no flags set)
        tcp flags == 0x0 counter name "cnt_bad_flags_drop" drop
        # Xmas Tree Scan (FIN, PSH, URG set)
        tcp flags & (fin | psh | urg) == fin | psh | urg counter name "cnt_bad_flags_drop" drop
        # SYN-FIN scan (illegal combination)
        tcp flags & (syn | fin) == fin | syn counter name "cnt_bad_flags_drop" drop
        # SYN-RST scan (illegal combination)
        tcp flags & (syn | rst) == syn | rst counter name "cnt_bad_flags_drop" drop
        # FIN-only scan
        tcp flags & (fin | syn | rst | psh | ack | urg) == fin counter name "cnt_bad_flags_drop" drop

        # 8. Honeypot Ports: Trap active port scanners (Telnet 23, SMB 445, RDP 3389)
        tcp dport { 23, 445, 3389 } update @portscan_blacklist { ip saddr } counter name "cnt_portscan_drop" drop

        # 9. Ingress Rate Limiting: SYN Flood Mitigation on Web Ports
        tcp dport { 80, 443, 8080 } tcp flags syn limit rate 25/second burst 50 packets accept
        tcp dport { 80, 443, 8080 } tcp flags syn counter name "cnt_syn_flood_drop" drop

        # 10. Whitelisted Production Service Ports
        tcp dport { 22, 80, 443, 8080 } accept

        # 11. Catch-All Default Drop with Observability Counter
        counter name "cnt_default_drop" drop
    }

    # --------------------------------------------------------------------------
    # Forwarding Filter Chain (No Routing Allowed)
    # --------------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    # --------------------------------------------------------------------------
    # Egress Output Chain
    # --------------------------------------------------------------------------
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
