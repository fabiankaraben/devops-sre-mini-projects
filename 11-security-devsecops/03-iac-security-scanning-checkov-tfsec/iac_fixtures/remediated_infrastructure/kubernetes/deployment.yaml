# ==============================================================================
# deployment.yaml - Hardened & Compliant Kubernetes Deployment Manifest
# ==============================================================================
# Applies CIS Kubernetes Benchmark & Pod Security Standards (Restricted Profile):
# 1. Non-root user execution (UID 10001) with allowPrivilegeEscalation disabled
# 2. Immutable read-only root filesystem with ephemeral emptyDir /tmp mount
# 3. Dropped ALL Linux kernel capabilities
# 4. Strict CPU & Memory resource requests and limits (Prevents DoS)
# 5. Native Liveness and Readiness probes configured
# 6. Service account token automount disabled
# 7. Image digest pinned with ImagePullPolicy Always
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened-api-service
  namespace: production
  labels:
    app.kubernetes.io/name: hardened-api
    app.kubernetes.io/part-of: secure-microservices
    app.kubernetes.io/version: "1.2.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hardened-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hardened-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-server
          image: nginx:1.25.4-alpine@sha256:6857d2dae63e052057f2db389a7061188ac9a92a3fa8d402bde68f36df6fada1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http-port
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: cache-volume
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
