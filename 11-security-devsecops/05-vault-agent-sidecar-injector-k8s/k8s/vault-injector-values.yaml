# ==============================================================================
# vault-injector-values.yaml - Helm Values for HashiCorp Vault Agent Injector
# ==============================================================================
# Configures the Vault Agent Mutating Admission Webhook controller on Kubernetes.
# ==============================================================================

global:
  enabled: true
  tlsDisable: true

injector:
  enabled: true
  replicas: 1
  image:
    repository: "hashicorp/vault-k8s"
    tag: "1.3.1"
  agentImage:
    repository: "hashicorp/vault"
    tag: "1.15.5"
  authPath: "auth/kubernetes"
  logLevel: "info"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

server:
  enabled: true
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/vault/data"
      }
