# ==============================================================================
# docker-compose.yml - Container Signing & SBOM Sandbox with Local OCI Registry
# ==============================================================================
# Sets up a local OCI-compliant container registry on port 5001 and defines the
# target microservice container build.
# ==============================================================================

services:
  local-registry:
    image: registry:2
    container_name: local-oci-registry
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry

  secure-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost:5001/secure-app:1.0.0
    container_name: secure-app-service
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
    depends_on:
      - local-registry

volumes:
  registry_data:
    name: local_oci_registry_data
