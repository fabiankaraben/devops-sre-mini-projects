apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow ':latest' Image Tag
    policies.kyverno.io/category: Best Practices / Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ':latest' image tag is mutable and unpredictable, making rollbacks unreliable
      and deployments susceptible to unexpected upstream changes. All container images
      must specify an explicit, immutable semantic version or SHA-256 digest.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Using ':latest' tag or untagged images is prohibited. Use an explicit semantic tag or digest."
        pattern:
          spec:
            =(ephemeralContainers):
              - image: "!*:latest & *:* | *sha256:*"
            =(initContainers):
              - image: "!*:latest & *:* | *sha256:*"
            containers:
              - image: "!*:latest & *:* | *sha256:*"
