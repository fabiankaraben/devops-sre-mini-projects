apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mesh-secure
  labels:
    app: backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: v1
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: payment-api
          image: python:3.11-alpine
          command:
            - python3
            - -c
            - |
              import http.server
              import socketserver
              import json

              class PaymentHandler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path.startswith("/api/v1/payments"):
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.end_headers()
                          self.wfile.write(json.dumps({
                              "status": "success",
                              "service": "payment-backend",
                              "message": "Authorized mTLS payment transaction processed",
                              "mtls_enforced": True
                          }).encode("utf-8"))
                      elif self.path == "/health":
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.end_headers()
                          self.wfile.write(json.dumps({"status": "healthy"}).encode("utf-8"))
                      else:
                          self.send_response(404)
                          self.send_header("Content-Type", "application/json")
                          self.end_headers()
                          self.wfile.write(json.dumps({"error": "Endpoint not found"}).encode("utf-8"))

                  def log_message(self, format, *args):
                      pass

              PORT = 8080
              with socketserver.TCPServer(("", PORT), PaymentHandler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mesh-secure
  labels:
    app: backend
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: backend
