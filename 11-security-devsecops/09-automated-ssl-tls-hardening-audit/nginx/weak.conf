# ==============================================================================
# weak.conf - Vulnerable / Legacy Nginx TLS Configuration (Target: Grade F)
# ==============================================================================
# Demonstrates legacy insecure configurations:
#   - Deprecated protocols allowed (TLSv1.0, TLSv1.1)
#   - Legacy CBC and weak ciphers allowed (DES-CBC3-SHA, AES-CBC)
#   - Missing HSTS and security headers
# ==============================================================================

server {
    listen 80;
    server_name localhost weak-tls-server;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost weak-tls-server;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Vulnerability: Deprecated TLS 1.0 and 1.1 enabled
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # Vulnerability: Weak legacy ciphers (CBC mode, 3DES, non-PFS, SECLEVEL=0)
    ssl_ciphers 'DEFAULT@SECLEVEL=0:ALL:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-SHA:AES256-SHA:DES-CBC3-SHA:RC4-SHA:RC4-MD5';
    ssl_prefer_server_ciphers off;

    # Vulnerability: No HSTS header, no anti-clickjacking headers

    location / {
        default_type application/json;
        return 200 '{"status":"vulnerable","endpoint":"weak-tls-server","tls_protocols":["TLSv1.0","TLSv1.1","TLSv1.2"],"hsts":false}\n';
    }

    location /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"weak-tls-server"}\n';
    }
}
