# ==============================================================================
# hardened.conf - Zero-Trust Hardened Nginx TLS Configuration (Target: Grade A+)
# ==============================================================================
# Implements Mozilla Modern / NIST SP 800-52r2 compliance standards:
#   - Only modern secure protocols: TLSv1.2 and TLSv1.3
#   - Forward Secrecy (PFS) & AEAD ciphers exclusively (GCM, CHACHA20)
#   - HSTS enabled with max-age=2 years, includeSubDomains, preload
#   - Comprehensive HTTP security headers (no-sniff, frame deny)
# ==============================================================================

server {
    listen 80;
    server_name localhost hardened-tls-server;
    return 301 https://$host:9443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost hardened-tls-server;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Hardening: Only TLS 1.2 and TLS 1.3
    ssl_protocols TLSv1.2 TLSv1.3;

    # Hardening: Modern AEAD and PFS cipher suites only
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;

    # TLS Session Optimization & Ticket Disabling (Forward Secrecy preservation)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Hardening: Strict-Transport-Security (HSTS) with 2-year duration & preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Anti-Sniffing & Framing protections
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        default_type application/json;
        return 200 '{"status":"hardened","endpoint":"hardened-tls-server","tls_protocols":["TLSv1.2","TLSv1.3"],"ciphers":"AEAD-PFS-Only","hsts":true}\n';
    }

    location /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"hardened-tls-server"}\n';
    }
}
