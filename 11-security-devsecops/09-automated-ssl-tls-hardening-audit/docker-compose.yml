# ==============================================================================
# docker-compose.yml - SSL/TLS Hardening Audit Sandbox
# ==============================================================================
# Deploys two mock HTTPS endpoints:
#   1. weak-tls-server      (Port 8443): TLS 1.0/1.1, legacy ciphers, no HSTS (Grade F)
#   2. hardened-tls-server  (Port 9443): TLS 1.2/1.3, modern AEAD/PFS, HSTS (Grade A+)
# ==============================================================================

services:
  weak-tls-server:
    build:
      context: .
      dockerfile: Dockerfile.weak
    image: weak-tls-server:latest
    container_name: weak-tls-server
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8081:80"

  hardened-tls-server:
    build:
      context: .
      dockerfile: Dockerfile.hardened
    image: hardened-tls-server:latest
    container_name: hardened-tls-server
    restart: unless-stopped
    ports:
      - "9443:443"
      - "8082:80"
