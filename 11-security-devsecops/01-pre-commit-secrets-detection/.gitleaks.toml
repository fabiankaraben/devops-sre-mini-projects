# ==============================================================================
# .gitleaks.toml - Enterprise Gitleaks Configuration & Custom Detection Rules
# ==============================================================================
# Defines regex patterns, Shannon entropy thresholds, and allowlists for detecting
# hardcoded secrets and credentials during pre-commit scans and CI/CD pipelines.
# ==============================================================================

title = "DevSecOps Git Secrets Detection Suite Configuration"

# ------------------------------------------------------------------------------
# 1. AWS Access Key ID
# ------------------------------------------------------------------------------
[[rules]]
id = "aws-access-key-id"
description = "Detected AWS Access Key ID (AKIA/ASIA)"
regex = '''\b((?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16})\b'''
keywords = ["akia", "asia", "abia", "acca"]
secretGroup = 1
tags = ["key", "AWS", "credentials"]

# ------------------------------------------------------------------------------
# 2. AWS Secret Access Key
# ------------------------------------------------------------------------------
[[rules]]
id = "aws-secret-access-key"
description = "Detected AWS Secret Access Key"
regex = '''(?i)(?:aws_secret_access_key|aws_secret_key|secret_access_key|aws_secret)\s*(?:=|:)\s*['"]?([A-Za-z0-9/+=]{40})['"]?'''
entropy = 3.5
secretGroup = 1
keywords = ["aws_secret_access_key", "secret_access_key", "aws_secret"]
tags = ["key", "AWS", "secret"]

# ------------------------------------------------------------------------------
# 3. GitHub Personal Access Token (PAT)
# ------------------------------------------------------------------------------
[[rules]]
id = "github-pat"
description = "Detected GitHub Personal Access Token (Classic & Fine-grained)"
regex = '''\b(ghp_[0-9a-zA-Z]{36}|github_pat_[0-9a-zA-Z_]{82}|gho_[0-9a-zA-Z]{36}|ghu_[0-9a-zA-Z]{36}|ghs_[0-9a-zA-Z]{36})\b'''
keywords = ["ghp_", "github_pat_", "gho_", "ghu_", "ghs_"]
secretGroup = 1
tags = ["key", "GitHub", "token"]

# ------------------------------------------------------------------------------
# 4. Slack Incoming Webhook
# ------------------------------------------------------------------------------
[[rules]]
id = "slack-incoming-webhook"
description = "Detected Slack Incoming Webhook URL"
regex = '''https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8,10}/B[a-zA-Z0-9_]{8,12}/[a-zA-Z0-9_]{24}'''
keywords = ["hooks.slack.com"]
tags = ["webhook", "Slack"]

# ------------------------------------------------------------------------------
# 5. OpenAI API Key
# ------------------------------------------------------------------------------
[[rules]]
id = "openai-api-key"
description = "Detected OpenAI API Secret Key"
regex = '''\b(sk-[a-zA-Z0-9]{20,48}|sk-proj-[a-zA-Z0-9_-]{48,128})\b'''
keywords = ["sk-", "sk-proj-"]
secretGroup = 1
tags = ["key", "OpenAI", "AI"]

# ------------------------------------------------------------------------------
# 6. Asymmetric Private Cryptographic Keys
# ------------------------------------------------------------------------------
[[rules]]
id = "private-cryptographic-key"
description = "Detected Asymmetric Private Key (RSA, DSA, EC, OPENSSH, PGP)"
regex = '''-----BEGIN (?:(?:RSA|DSA|EC|OPENSSH|PGP) )?PRIVATE KEY-----'''
keywords = ["-----BEGIN"]
tags = ["key", "cryptography", "private"]

# ------------------------------------------------------------------------------
# 7. Generic API Key & High-Entropy Secret Assignment
# ------------------------------------------------------------------------------
[[rules]]
id = "generic-api-key"
description = "Detected Generic High-Entropy API Key or Secret Variable Assignment"
regex = '''(?i)(?:api_key|apikey|secret_key|client_secret|auth_token|access_token|private_token)\s*(?:=|:)\s*['"]([a-zA-Z0-9_\-]{24,128})['"]'''
entropy = 3.8
secretGroup = 1
keywords = ["api_key", "apikey", "secret_key", "client_secret", "auth_token", "access_token"]
tags = ["key", "generic", "entropy"]

# ------------------------------------------------------------------------------
# 8. Hardcoded JWT Secret / HMAC Key
# ------------------------------------------------------------------------------
[[rules]]
id = "jwt-secret-key"
description = "Detected Hardcoded JWT Signing Secret"
regex = '''(?i)(?:jwt_secret|jwt_key|token_secret|signing_key)\s*(?:=|:)\s*['"]([a-zA-Z0-9!@#$%^&*()_+=\-]{16,64})['"]'''
entropy = 3.2
secretGroup = 1
keywords = ["jwt_secret", "jwt_key", "signing_key"]
tags = ["jwt", "secret", "auth"]

# ------------------------------------------------------------------------------
# Global Allowlists: Ignored paths, mock placeholders, and false-positive exceptions
# ------------------------------------------------------------------------------
[allowlist]
description = "Global allowlist for documentation placeholders and mock test fixtures"
paths = [
    '''\.gitleaks\.toml$''',
    '''\.secrets\.baseline$''',
    '''\.git/''',
    '''test_fixtures/mock_secrets/allowlisted_mock_token\.py$'''
]
regexes = [
    '''AKIAIOSFODNN7EXAMPLE''',
    '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
    '''EXAMPLE_KEY_DO_NOT_USE_[0-9A-Z]+''',
    '''YOUR_API_KEY_HERE''',
    '''sk-mock-allowlisted-demo-key-1234567890abcdef'''
]
stopwords = [
    "AKIAIOSFODNN7EXAMPLE",
    "EXAMPLEKEY",
    "MOCK_ALLOWED_TOKEN"
]
